name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: add repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
      # KEY_PASSWORD so every build is signed with the same key (needed for
      # updates to install over the previous version).
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          AR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ar-media-bridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ar-media-bridge-apk
          path: android/ar-media-bridge.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/ar-media-bridge.apk
